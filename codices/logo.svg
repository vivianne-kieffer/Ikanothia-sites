<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="400" height="200" />
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="400" y="0" width="400" height="200" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="white"/>

  <!-- Gold left halves -->
  <g clip-path="url(#leftHalf)">
    <text x="400" y="145" font-family="Garamond, Georgia, serif" font-size="96" font-weight="300" text-anchor="middle" letter-spacing="4" fill="#D4AF37" stroke="none">CODICES</text>
  </g>

  <!-- Silver right halves -->
  <g clip-path="url(#rightHalf)">
    <text x="400" y="145" font-family="Garamond, Georgia, serif" font-size="96" font-weight="300" text-anchor="middle" letter-spacing="4" fill="#C0C0C0" stroke="none">CODICES</text>
  </g>

  <!-- Dividing line -->
  <line x1="400" y1="90" x2="400" y2="160" stroke="#E0E0E0" stroke-width="1" opacity="0.3"/>
</svg>